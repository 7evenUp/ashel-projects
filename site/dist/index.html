<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e6df">
  <meta name="description" content="Мой опыт разработки в Crypton: семь проектов, необычные задачи и истории за интерфейсами. Интерактивный дневник frontend-разработчика.">
  <title>Crypton — дневник разработчика</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="preload" href="./assets/commons-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#spread">К проекту</a>
  <div class="desk-decoration compass" aria-hidden="true"><span>N</span>✧</div>
  <div class="desk-decoration little-stars" aria-hidden="true">✦<span>✧</span></div>
  <main class="desk">
    <div class="book-shell">
      <nav class="bookmarks" aria-label="Проекты"></nav>
      <div class="book-cover">
        <div class="book" id="spread" tabindex="-1" aria-label="Разворот проекта"></div>
        <div class="page-turn" aria-hidden="true"></div>
      </div>
      <div class="ribbon" aria-hidden="true"></div>
    </div>
    <footer class="book-controls">
      <button class="page-button" id="previous" aria-label="Предыдущий проект"><span aria-hidden="true">←</span><span class="nav-label">Назад</span></button>
      <div class="reading-progress"><span class="chapter-counter"></span><div class="progress-dots" aria-hidden="true"></div><span class="keyboard-hint">Листайте историю <kbd>←</kbd> <kbd>→</kbd></span></div>
      <button class="page-button" id="next" aria-label="Следующий проект"><span class="nav-label">Дальше</span><span aria-hidden="true">→</span></button>
    </footer>
  </main>
  <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  <dialog class="journal-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span class="eyebrow">ЗАПИСИ РАЗРАБОТЧИКА</span><button class="close-dialog" aria-label="Закрыть заметки">✕</button></div><h2 id="dialog-title"></h2><div id="dialog-content"></div></dialog>
  <noscript><p class="noscript">Для перелистывания книги включите JavaScript в браузере.</p></noscript>
</body>
</html>
